<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Caderno de Pregações</title><style>
:root{--navy:#07131f;--gold:#c8a86b;--cream:#f7f4ed;--muted:#71808d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI Variable Text","Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 75% 0%,rgba(200,168,107,.18),transparent 28rem),linear-gradient(135deg,#06111c,#0b2132);display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);background:#fffdfa;border:1px solid rgba(200,168,107,.3);border-radius:22px;padding:38px;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center}.logo{width:300px;max-width:92%;margin-bottom:24px}.k{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#a78447;font-weight:700}h1{font-size:27px;margin:10px 0 8px;color:#14202b}.intro{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 25px}.google{width:100%;border:1px solid #ddd7cc;border-radius:11px;background:white;padding:13px 15px;font:600 14px inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:11px}.google:hover{border-color:var(--gold)}.g{font:bold 19px Arial;color:#4285f4}.msg{font-size:12px;min-height:18px;color:#a95050;margin-top:13px}.foot{font-size:10px;color:#89949d;margin-top:24px}</style></head><body><main class="box"><img class="logo" src="assets/logo_caderno_pregacoes.png"><div class="k">Seu espaço de estudo</div><h1>Entre na sua conta</h1><p class="intro">Suas pregações ficam organizadas na sua conta e disponíveis em seus dispositivos.</p><button id="googleBtn" class="google"><span class="g">G</span> Continuar com Google</button><div id="msg" class="msg"></div><div class="foot">Organize • Estude • Pregue • Impacte</div></main><script type="module" src="js/login.js"></script></body></html>
